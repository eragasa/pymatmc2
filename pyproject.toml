[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymatmc2"
version = "0.1"
description = "Historical Python implementation of the Multi-Cell Monte Carlo method"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Eugene J. Ragasa" },
]
keywords = [
  "alloys",
  "computational materials science",
  "monte carlo",
  "phase stability",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase>=3.22",
  "numpy>=1.24",
  "pandas>=1.5",
  "PyYAML>=6",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.7",
]
dev = [
  "build>=1",
  "pytest>=7",
]
legacy-postgresql = [
  "psycopg2>=2.9",
]

[project.urls]
Homepage = "https://github.com/eragasa/pymatmc2"
Repository = "https://github.com/eragasa/pymatmc2"
Issues = "https://github.com/eragasa/pymatmc2/issues"

[tool.setuptools]
license-files = ["LICENSE", "MEXM_LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymatmc2*", "mexm*"]
